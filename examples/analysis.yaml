# Required. Relative paths resolve against the directory Nextflow runs from.
input: samples.tsv
assembly: GRCh38
fasta: /refs/GRCh38.primary_assembly.genome.fa
gtf: /refs/gencode.v46.annotation.gtf
outdir: results

# The protocol. generic_3prime calibrates every compatible evidence source.
library_profile: generic_3prime

# Mitochondrial contigs are excluded by default. A list here replaces the
# default, so repeat these names to keep excluding them; [] keeps every contig.
# excluded_contigs: [chrM, MT, chrMT]

# Slurm, used with -profile slurm.
# slurm_account: my_lab
# slurm_partition: general

# Put the Nextflow work directory on a scratch filesystem.
# scratch: /work/users/me

# Apptainer mounts only some host paths by default. List every directory that
# holds inputs, including the directories the alignments live in.
# bind_paths:
#   - /proj/my_lab
#   - /work/users/me
