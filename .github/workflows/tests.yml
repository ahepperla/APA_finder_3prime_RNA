name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: envs/pacusage.yml
          activate-environment: pacusage
          auto-activate-base: false
      # The Nextflow version on the project's cluster.
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "25.04.7"
      - shell: bash -el {0}
        run: |
          pip install --no-deps -e .
          tests/pipeline/run_nextflow.sh
