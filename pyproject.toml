[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pacusage"
version = "0.1.0"
description = "Reproducible discovery and differential analysis of polyadenylation site usage"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PACusage contributors" }]
dependencies = [
  "Jinja2>=3.1",
  "jsonschema>=4.22",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pysam>=0.22",
  "PyYAML>=6.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
pacusage = "pacusage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pacusage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
